name: Deploy npm Web App to GitHub Pages

on:
  push:
    branches:
      - npm-webapp
    paths:
      - "npm-webapp/index.html"
      - "npm-webapp/schema.sql"
      - ".github/workflows/npm-webapp-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-npm-webapp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s npm-webapp/index.html
          grep -F "GitHub Pages browser adapter" npm-webapp/index.html
          grep -F "student_compare_psp_v1" npm-webapp/index.html
          grep -F "student_compare_udise_v1" npm-webapp/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: npm-webapp
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
