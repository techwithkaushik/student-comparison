name: Flutter Android

on:
  push:
    branches:
      - flutter-android

  pull_request:
    branches:
      - flutter-android

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Verify project
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "Flutter project found"

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=student_comparison \
            .

      - name: Remove generated widget test
        run: |
          rm -f test/widget_test.dart

      - name: Configure signing keystore
        if: github.event_name == 'push'
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          set -e

          echo "$SIGNING_KEYSTORE" | base64 --decode > android/app/signing-key.jks

          test -s android/app/signing-key.jks

          echo "Signing keystore created successfully"
          ls -lh android/app/signing-key.jks

      - name: Configure release signing
        if: github.event_name == 'push'
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          old = '''    buildTypes {
              release {
                  // TODO: Add your own signing config for the release build.
                  // Signing with the debug keys for now, so `flutter run --release` works.
                  signingConfig = signingConfigs.getByName("debug")
              }
          }'''

          new = '''    signingConfigs {
              create("releaseCustom") {
                  storeFile = file("signing-key.jks")
                  storePassword = project.property("SIGNING_STORE_PASSWORD") as String
                  keyAlias = project.property("SIGNING_KEY_ALIAS") as String
                  keyPassword = project.property("SIGNING_KEY_PASSWORD") as String
              }
          }

          buildTypes {
              release {
                  signingConfig = signingConfigs.getByName("releaseCustom")
              }
          }'''

          if old not in text:
              print("ERROR: Expected generated buildTypes block not found")
              print("Current build.gradle.kts:")
              print(text)
              raise SystemExit(1)

          text = text.replace(old, new)

          path.write_text(text)

          print("Release signing configuration applied successfully.")
          PY

          echo "===== FINAL build.gradle.kts ====="
          cat android/app/build.gradle.kts

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify keystore
        if: github.event_name == 'push'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -e

          keytool \
            -list \
            -v \
            -keystore android/app/signing-key.jks \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            | grep -E "Alias name:|Entry type:|SHA256:"

      - name: Build ARM32 signed APK
        if: github.event_name == 'push'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -e

          flutter build apk \
            --release \
            --target-platform android-arm \
            --dart-define=SIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -P SIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -P SIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD" \
            -P SIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD"

      - name: Verify APK signature
        if: github.event_name == 'push'
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "===== APK SIGNATURE ====="

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

      - name: Upload signed APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: student-comparison-arm32-signed
          path: build/app/outputs/flutter-apk/app-release.apk
