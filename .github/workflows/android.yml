name: Flutter Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "files/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "files/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/android.yml"

concurrency:
  group: flutter-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true
      - name: Verify project
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter project found"
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org=org.techwithkaushik --project-name=student_comparison .
      - name: Remove generated widget test
        run: rm -f test/widget_test.dart
      - name: Configure Android manifest and Gradle
        run: |
          set -e
          cp files/build.gradle.kts android/app/build.gradle.kts
          rm -f android/app/src/main/kotlin/org/techwithkaushik/student_comparison/MainActivity.kt
          mkdir -p android/app/src/main/java/org/techwithkaushik/student_comparison
          cp files/MainActivity.java android/app/src/main/java/org/techwithkaushik/student_comparison/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace(
              'android:name=".MainActivity"',
              'android:name="org.techwithkaushik.student_comparison.MainActivity"',
          )
          manifest.write_text(text)
          PY
      - name: Decode Keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: dev_keystore.jks
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/flutter-analyze.log
          exit ${PIPESTATUS[0]}
      - name: Capture analyzer diagnostics
        if: failure() && steps.analyze.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          cp /tmp/flutter-analyze.log ci-diagnostics/latest-analyze.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics/latest-analyze.log
          git commit -m "ci: capture analyzer diagnostics [skip ci]"
          git push
      - name: Test
        run: flutter test
      - name: Build ARM32 signed APK
        run: |
          mkdir -p build/symbols
          flutter build apk --release --target-platform android-arm --obfuscate --split-debug-info=build/symbols
        env:
          SIGNING_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      - name: Verify APK signature
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload signed APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: student-comparison-arm32-signed
          path: build/app/outputs/flutter-apk/app-release.apk
